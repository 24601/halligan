name: Publish generated packages
# cspell:ignore Prelease Dskip

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Rehearse without uploading anywhere
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  rust-crates-io:
    # Halligan fork: publishing to upstream's npm/PyPI/crates/Maven packages is not ours to do.
    # Set the repository variable HALLIGAN_PUBLISH=true to enable these jobs.
    if: ${{ vars.HALLIGAN_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Rewrites the checkout to the fork's published names from
      # release/halligan-identity.json: crate halligan, library target axllm.
      # Never committed in applied state.
      - name: Apply Halligan package identities
        run: |
          node scripts/apply-halligan-identity.mjs --allow-dirty --skip-links
          node scripts/apply-halligan-identity.mjs --verify --only generated
      # Trusted publishing via GitHub OIDC; a CARGO_REGISTRY_TOKEN secret
      # takes precedence for the first publish before the crate exists.
      - id: oidc
        if: env.DRY_RUN != 'true'
        uses: rust-lang/crates-io-auth-action@v1
        continue-on-error: true
      - name: Publish halligan to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.oidc.outputs.token }}
        run: |
          FLAGS=""
          if [ "$DRY_RUN" = "true" ]; then
            FLAGS="--dry-run"
          fi
          cargo publish $FLAGS --no-verify --manifest-path packages/rust/Cargo.toml

  python-pypi:
    # Halligan fork: publishing to upstream's npm/PyPI/crates/Maven packages is not ours to do.
    # Set the repository variable HALLIGAN_PUBLISH=true to enable these jobs.
    if: ${{ vars.HALLIGAN_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Rewrites the checkout to the fork's published names: distribution
      # halligan-ax, import package still axllm. Never committed in applied state.
      - name: Apply Halligan package identities
        run: |
          node scripts/apply-halligan-identity.mjs --allow-dirty --skip-links
          node scripts/apply-halligan-identity.mjs --verify --only generated
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build packages/python
          python -m twine check packages/python/dist/*
      # Trusted publishing: no API token. PyPI must carry a trusted publisher
      # (or a pending publisher for the first upload) for halligan-ax, bound to
      # owner 24601, repository halligan, workflow package-publish.yml.
      - name: Publish halligan-ax to PyPI
        if: env.DRY_RUN != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist
          skip-existing: true

  java-github-packages:
    # Halligan fork: publishing to upstream's npm/PyPI/crates/Maven packages is not ours to do.
    # Set the repository variable HALLIGAN_PUBLISH=true to enable these jobs.
    if: ${{ vars.HALLIGAN_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
      # Configures ~/.m2/settings.xml with the `github` server that the
      # distributionManagement block added by the identity script names. GitHub
      # Packages needs only GITHUB_TOKEN: no GPG key and no Sonatype account,
      # so the fork does not activate upstream's Maven Central `release` profile.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      # Rewrites the checkout to io.github.24601:halligan and points
      # distributionManagement at GitHub Packages. The Java package stays
      # dev.axllm.ax. Never committed in applied state.
      - name: Apply Halligan package identities
        run: |
          node scripts/apply-halligan-identity.mjs --allow-dirty --skip-links
          node scripts/apply-halligan-identity.mjs --verify --only generated
      # Dry run builds the jars but stops before upload; a real release runs
      # `deploy`, which maven-deploy-plugin uploads to GitHub Packages.
      - name: Publish io.github.24601:halligan to GitHub Packages
        working-directory: packages/java
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GOAL="deploy"
          if [ "$DRY_RUN" = "true" ]; then
            GOAL="verify"
          fi
          mvn -B -ntp -DskipTests "$GOAL"
